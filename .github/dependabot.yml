version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - hman38705
    assignees:
      - hman38705
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # Workflow actions are pinned to full commit SHAs (with a `# vX.Y.Z` comment)
  # so a moved tag can never swap in different code. Dependabot understands this
  # format and opens PRs that bump both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
