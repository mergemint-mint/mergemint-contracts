name: WASM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none

      - name: Report WASM binary size
        run: |
          WASM_FILE=$(find target/wasm32v1-none/release -name "*.wasm" | head -1)
          if [ -n "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            echo "### WASM Binary Size" >> $GITHUB_STEP_SUMMARY
            echo "**File:** \`$WASM_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** ${SIZE} bytes ($(echo "scale=2; $SIZE/1024" | bc) KB)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check WASM size regression
        env:
          WASM_SIZE_BASELINE_FILE: .github/wasm-size-baseline.txt
          WASM_SIZE_THRESHOLD_PERCENT: 10
        run: |
          WASM_FILE=$(find target/wasm32v1-none/release -name "*.wasm" | head -1)
          if [ -z "$WASM_FILE" ]; then
            echo "No WASM artifact found; skipping size regression check."
            exit 0
          fi

          if [ ! -f "$WASM_SIZE_BASELINE_FILE" ]; then
            echo "No baseline found at $WASM_SIZE_BASELINE_FILE; skipping regression check."
            exit 0
          fi

          SIZE=$(wc -c < "$WASM_FILE")
          BASELINE=$(cat "$WASM_SIZE_BASELINE_FILE")
          MAX_ALLOWED=$(( BASELINE + BASELINE * WASM_SIZE_THRESHOLD_PERCENT / 100 ))

          echo "### WASM Size Regression Check" >> $GITHUB_STEP_SUMMARY
          echo "Baseline: ${BASELINE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "Current: ${SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "Max allowed (+${WASM_SIZE_THRESHOLD_PERCENT}%): ${MAX_ALLOWED} bytes" >> $GITHUB_STEP_SUMMARY

          if [ "$SIZE" -gt "$MAX_ALLOWED" ]; then
            echo "::error::WASM binary size regressed beyond ${WASM_SIZE_THRESHOLD_PERCENT}% threshold (baseline ${BASELINE} bytes, current ${SIZE} bytes)."
            exit 1
          fi

          echo "WASM size within the ${WASM_SIZE_THRESHOLD_PERCENT}% regression threshold."
