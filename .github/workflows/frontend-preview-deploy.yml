name: Frontend Preview Deploy

# Preview deployments, step 2 of 2: deploy the site built by
# `frontend-preview.yml` and comment its URL on the pull request.
#
# `workflow_run` runs this file from the default branch, never from the PR, so
# the Cloudflare secrets are only ever available to reviewed code. The PR's
# code is not checked out or executed here: the job only downloads the static
# files from the artifact and uploads them to Cloudflare Pages.
#
# Setup (Settings → Environments → "frontend-preview"):
#   Secret   CLOUDFLARE_API_TOKEN       token with "Cloudflare Pages: Edit"
#   Secret   CLOUDFLARE_ACCOUNT_ID      Cloudflare account ID
#   Variable CLOUDFLARE_PAGES_PROJECT   optional, Pages project name
#                                       (default: mergemint-frontend-preview)
# Until the token is set, the job skips with a notice instead of failing.

on:
  workflow_run:
    workflows: ["Frontend Preview"]
    types: [completed]

concurrency:
  # One deploy per PR branch at a time; a newer build supersedes an older one.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # download the artifact from the build run
      pull-requests: write # comment the preview URL
    environment:
      name: frontend-preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    env:
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mergemint-frontend-preview' }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # workflow_run.pull_requests is empty for fork PRs, so look the PR up by
      # its head commit instead of trusting anything inside the artifact.
      - name: Find pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const pr = pulls.find(
              (p) => p.head.sha === process.env.HEAD_SHA && p.head.repo?.full_name === process.env.HEAD_REPO,
            );
            if (!pr) {
              core.notice(`No open PR has head ${process.env.HEAD_SHA}; it was closed or updated. Skipping.`);
              return;
            }
            core.setOutput('number', String(pr.number));

      - name: Check Cloudflare credentials
        id: config
        if: steps.pr.outputs.number != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in the 'frontend-preview' environment; skipping preview deploy."
          fi

      - name: Download preview artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-preview
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          # The branch name gives each PR a stable alias: pr-<n>.<project>.pages.dev
          command: >-
            pages deploy dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=pr-${{ steps.pr.outputs.number }}
            --commit-hash=${{ env.HEAD_SHA }}
            --commit-dirty=true

      - name: Comment preview URL
        if: steps.config.outputs.configured == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- frontend-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const url = process.env.ALIAS_URL || process.env.DEPLOYMENT_URL;
            const body = [
              marker,
              '### Frontend preview',
              '',
              `:rocket: **${url}** (Stellar testnet)`,
              '',
              `<sub>Commit ${process.env.HEAD_SHA.slice(0, 7)} · [this build](${process.env.DEPLOYMENT_URL}) · updated on every push, deleted when the PR closes</sub>`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
