name: CodeQL

# Static security analysis (CodeQL) for the TypeScript/JavaScript packages:
# frontend/, sdk/, backend/ and mergemint-frontend/. Scope and exclusions live
# in .github/codeql/codeql-config.yml. Findings appear under
# Security → Code scanning; new alerts on a PR show up as review annotations.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "sdk/**"
      - "backend/**"
      - "mergemint-frontend/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "sdk/**"
      - "backend/**"
      - "mergemint-frontend/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC — picks up new CodeQL queries against unchanged code
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
      actions: read # required by codeql-action on private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # JS/TS is analysed from source; no install or build step needed.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
