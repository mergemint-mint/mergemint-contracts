name: Frontend Preview Cleanup

# Deletes a PR's Cloudflare Pages preview (see frontend-preview-deploy.yml)
# once the PR is closed or merged, and updates the preview comment.
#
# `pull_request_target` runs this file from the base branch with access to the
# environment secrets. That is safe here because the job never checks out or
# runs code from the PR; it only calls the Cloudflare and GitHub APIs.

on:
  pull_request_target:
    types: [closed]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-preview*.yml"

permissions: {}

jobs:
  cleanup:
    name: Delete preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # update the preview comment
    environment:
      name: frontend-preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete Cloudflare Pages deployments for this PR
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mergemint-frontend-preview' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in the 'frontend-preview' environment; nothing to clean up."
            exit 0
          fi

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          BRANCH="pr-${PR_NUMBER}"
          PER_PAGE=25

          # Collect every preview deployment of this PR's branch.
          ids=()
          page=1
          while :; do
            resp="$(curl -fsS -H "$AUTH" "${API}?env=preview&per_page=${PER_PAGE}&page=${page}")"
            mapfile -t found < <(jq -r --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<< "$resp")
            ids+=("${found[@]}")
            [ "$(jq '.result | length' <<< "$resp")" -lt "$PER_PAGE" ] && break
            page=$((page + 1))
          done

          # force=true is required to delete the deployment behind the branch alias.
          for id in "${ids[@]}"; do
            [ -n "$id" ] || continue
            curl -fsS -X DELETE -H "$AUTH" "${API}/${id}?force=true" > /dev/null
            echo "Deleted deployment ${id}"
          done
          echo "Deleted ${#ids[@]} deployment(s) for ${BRANCH}."
          echo "deleted=true" >> "$GITHUB_OUTPUT"

      - name: Update preview comment
        if: steps.delete.outputs.deleted == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- frontend-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id,
              body: `${marker}\n### Frontend preview\n\n:wastebasket: The preview was deleted because this PR was closed.`,
            });
