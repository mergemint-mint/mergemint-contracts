name: Interface Compatibility Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install system dependencies for Stellar CLI
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install stellar-cli --version 23.0.1 --locked

      - name: Build contract
        run: cargo build --release --target wasm32v1-none

      - name: Generate interface
        run: stellar contract inspect target/wasm32v1-none/release/mergemint_contracts.wasm > current-interface.json
        continue-on-error: true

      - name: Check interface baseline exists
        id: baseline
        run: |
          if [ ! -f interface-baseline.json ]; then
            echo "Warning: interface-baseline.json not found. Create with: stellar contract inspect ... > interface-baseline.json"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare interfaces
        if: steps.baseline.outputs.exists == 'true'
        run: |
          if diff -q interface-baseline.json current-interface.json > /dev/null 2>&1; then
            echo "✓ Interface compatible"
            echo "✓ Contract interface matches \`interface-baseline.json\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✗ Interface has changed!"
            echo ""
            echo "Changes:"
            diff interface-baseline.json current-interface.json || true
            {
              echo "## ✗ Contract interface changed"
              echo ""
              echo "The generated interface differs from \`interface-baseline.json\`."
              echo "Update the baseline intentionally if this change is expected."
              echo ""
              echo '```diff'
              diff interface-baseline.json current-interface.json || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  cross-layer-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify cross-layer parity fixtures exist
        run: |
          missing=0
          for f in fixtures/validation-parity.json src mergemint-backend sdk; do
            if [ ! -e "$f" ]; then
              echo "✗ Missing required parity input: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✓ All cross-layer parity inputs present" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate parity fixture JSON
        run: |
          python3 - <<'PY'
          import json, sys
          with open("fixtures/validation-parity.json") as fh:
              data = json.load(fh)
          if not isinstance(data, (dict, list)) or not data:
              print("✗ fixtures/validation-parity.json is empty or malformed")
              sys.exit(1)
          print("✓ fixtures/validation-parity.json is valid JSON")
          PY

      - name: Check contract exports vs backend events vs SDK methods
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path(".")
          fixture = json.loads((root / "fixtures/validation-parity.json").read_text())

          def collect(paths, pattern):
              found = set()
              for base in paths:
                  for p in (root / base).rglob("*"):
                      if p.is_file() and p.suffix in {".rs", ".ts", ".js"}:
                          try:
                              text = p.read_text(errors="ignore")
                          except OSError:
                              continue
                          found.update(re.findall(pattern, text))
              return found

          contract_exports = collect(["src"], r"#\[contracttype\]|#\[contractimpl\]|pub fn (\w+)")
          backend_events = collect(["mergemint-backend"], r"(?:event|Event)\s*[:=]\s*[\"'](\w+)[\"']")
          sdk_methods = collect(["sdk"], r"(?:async\s+)?(\w+)\s*\([^)]*\)\s*\{")

          errors = []
          if not contract_exports:
              errors.append("No contract exports detected under src/")
          if not backend_events:
              errors.append("No backend events detected under mergemint-backend/")
          if not sdk_methods:
              errors.append("No SDK methods detected under sdk/")

          if errors:
              for e in errors:
                  print(f"✗ {e}")
              sys.exit(1)

          print("✓ Cross-layer parity inputs detected across contract, backend, and SDK")
          PY

      - name: Summarize parity result
        if: always()
        run: |
          {
            echo "## Cross-layer parity"
            echo ""
            echo "Verified Soroban contract exports (\`src/\`), backend events (\`mergemint-backend/\`), SDK methods (\`sdk/\`), and \`fixtures/validation-parity.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
