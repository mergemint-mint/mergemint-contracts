name: cargo-deny

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Run at 3 AM UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        manifest:
          - Cargo.toml
          - mergemint-backend/Cargo.toml
          - contracts/Cargo.toml
          - backend/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@92dc5ebdf5eacadfc5f4ca0b9cd8bf28ffcb8a88 # v2.0.15
        with:
          manifest-path: ${{ matrix.manifest }}
          log-level: warn

      - name: Comment on PR if licenses fail
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Cargo-deny checks failed. Please review dependencies for license compatibility and duplicate crate versions.\n\nRun locally: `cargo deny check` to see detailed output.'
            })
