name: cargo-deny

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Run at 3 AM UTC daily

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        manifest:
          - contracts/Cargo.toml
          - backend/Cargo.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: EmbarkStudios/cargo-deny-action@837b8f6b6a4f0f5b1c8f8f8f8f8f8f8f8f8f8f8f # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          log-level: warn

      - name: Comment on PR if licenses fail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Cargo-deny checks failed. Please review dependencies for license compatibility and duplicate crate versions.\n\nRun locally: `cargo deny check` to see detailed output.'
            })
