name: Nightly Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation testing
        id: mutants
        run: |
          cd contracts
          cargo mutants \
            --jobs 4 \
            --skip-timeout 60 \
            --test-timeout 60 \
            --exclude-files='**/tests/**,**/test.rs,**/*_test.rs' \
            --output mutations.txt || true

      - name: Extract surviving mutants summary
        if: always()
        run: |
          if [ -f contracts/mutations.txt ]; then
            echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Surviving mutants found. Review details in the artifact." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            tail -20 contracts/mutations.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutations-report
          path: contracts/mutations.txt
          retention-days: 30
