[book]
title = "MergeMint Documentation"
authors = ["MergeMint Contributors"]
language = "en"
multilingual = false
src = "docs"

[build]
build-dir = "book"
create-missing = false

[preprocessor.links]

[output.html]
site-url = "/mergemint-contracts/"
git-repository-url = "https://github.com/mergemint-mint/mergemint-contracts"
edit-url-template = "https://github.com/mergemint-mint/mergemint-contracts/edit/main/{path}"
no-section-label = false
additional-css = []

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.linkcheck]
warning-policy = "error"
