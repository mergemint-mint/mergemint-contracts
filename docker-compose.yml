version: '3.8'

services:
  mergemint-backend:
    build:
      context: ./mergemint-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite://mergemint.db
      - NETWORK_PASSPHRASE=Test SDF Network ; September 2015
    restart: unless-stopped

  mergemint-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8080
    depends_on:
      - mergemint-backend
    restart: unless-stopped
