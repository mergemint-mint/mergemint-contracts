[package]
name = "mergemint-contracts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
fuzz = ["dep:proptest"]

[dependencies]
soroban-sdk = "27.0.0"
proptest = { version = "1.4", optional = true }

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
proptest = "1.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
